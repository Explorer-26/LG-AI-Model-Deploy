services:
  - type: web
    name: lgids-v1
    runtime: python
    plan: free              # Render free tier (auto-spins down after 15 min idle)
    buildCommand: pip install -r requirements_api.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
